name: Deploy Node Backend to AWS Lightsail

on:
  push:
    branches:
      - dev
    paths:
      - 'server/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Server Files to Lightsail
        uses: appleboy/scp-action@master
        with:
          host: 43.205.229.25
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "server"
          target: "/var/www/html/paymentgateway"

      - name: Install Dependencies and Restart PM2
        uses: appleboy/ssh-action@master
        with:
          host: 43.205.229.25
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/html/paymentgateway/server
            npm install
            
            # Check if PM2 process exists, restart if it does, start if it doesn't
            if pm2 info gyb-backend > /dev/null 2>&1; then
              pm2 restart gyb-backend
            else
              pm2 start index.js --name "gyb-backend"
            fi
            pm2 save
