# Nginx Configuration Snippet for SEO and 403 Fixes

server {
    listen 80;
    server_name growyourbusiness.today;
    root /var/www/grow-your-business-landing/dist;
    index index.html;

    # Fix 403 Forbidden for Bots
    # Ensure User-Agent is not being blocked by generic rules
    location / {
        try_files $uri $uri/ /index.html;
        
        # Explicitly allow common crawlers if there's a global block
        if ($http_user_agent ~* (Googlebot|Bingbot|GPTBot|ClaudeBot|PerplexityBot|Applebot)) {
            access_log on;
        }
    }

    # Enable Gzip for Performance (Critical for SEO)
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml;
    gzip_disable "MSIE [1-6]\.";

    # Cache Control for static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # XML Sitemap and Robots.txt accessibility
    location ~* (robots\.txt|sitemap\.xml) {
        allow all;
        log_not_found off;
        access_log off;
    }
}
